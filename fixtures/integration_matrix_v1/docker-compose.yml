services:
  pg15-full:
    build:
      context: .
      dockerfile: images/pg15-hypopg/Dockerfile
    image: postgres-mcp/matrix-pg15-hypopg:local
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: matrix_user
      POSTGRES_PASSWORD: matrix_pass
      POSTGRES_DB: matrix_db
    ports:
      - "55415:5432"
    volumes:
      - ./initdb/full:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 40

  pg18-full:
    build:
      context: .
      dockerfile: images/pg18-hypopg/Dockerfile
    image: postgres-mcp/matrix-pg18-hypopg:local
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: matrix_user
      POSTGRES_PASSWORD: matrix_pass
      POSTGRES_DB: matrix_db
    ports:
      - "55418:5432"
    volumes:
      - ./initdb/full:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 40

  pg18-missing-ext:
    image: postgres-mcp/matrix-pg18-hypopg:local
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: matrix_user
      POSTGRES_PASSWORD: matrix_pass
      POSTGRES_DB: matrix_db
    depends_on:
      pg18-full:
        condition: service_started
    ports:
      - "55419:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 40

  pg18-pgstat-degraded:
    image: postgres-mcp/matrix-pg18-hypopg:local
    environment:
      POSTGRES_USER: matrix_user
      POSTGRES_PASSWORD: matrix_pass
      POSTGRES_DB: matrix_db
    depends_on:
      pg18-full:
        condition: service_started
    ports:
      - "55420:5432"
    volumes:
      - ./initdb/full:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 40
