[graph]
targets = []
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]
# Mozilla-derived trust anchors used by rustls-platform-verifier on supported
# targets. Narrow package/version allowance, aligned with the toolkit policy;
# not a general acceptance of this license or any advisory suppression.
exceptions = [{ name = "webpki-root-certs", version = "=1.0.11", allow = ["CDLA-Permissive-2.0"] }]

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Root manifest pins both sources to reviewed immutable revisions.
required-git-spec = "rev"
allow-git = [
  "https://github.com/sednalabs/mcp-toolkit-rs",
  "https://github.com/sednalabs/rust-sdk",
]
